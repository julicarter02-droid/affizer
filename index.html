<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Private Cam | Exclusive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; }
        .cam-frame { border: 2px solid #333; border-radius: 12px; overflow: hidden; background: #000; }
        .chat-box { height: 400px; overflow-y: auto; background: #0a0a0a; border-radius: 12px; }
        .message { padding: 8px 12px; margin-bottom: 5px; border-bottom: 1px solid #111; }
        .live-badge { background: #e11d48; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    </style>
</head>
<body>

<div class="p-4 border-b border-gray-800 flex justify-between items-center">
    <h1 class="text-xl font-black italic tracking-tighter">VIP<span class="text-rose-600">CAM</span></h1>
    <div class="flex items-center gap-2">
        <span class="live-badge animate-pulse">LIVE NOW</span>
        <span class="text-xs text-gray-400">12,402 Viewers</span>
    </div>
</div>

<div class="max-w-6xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 mt-4">
    
    <div class="lg:col-span-2">
        <div class="cam-frame aspect-video relative">
            <iframe id="camPlayer" src="" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="mt-6 p-6 glass rounded-xl">
            <h2 class="text-2xl font-bold">Watch My Private Show</h2>
            <p class="text-gray-400 mt-2">Unlock full access to my room and chat one-on-one with me. No limits, no restrictions.</p>
            <button onclick="window.location.href='YOUR_CPA_LINK'" class="mt-4 w-full bg-rose-600 py-3 rounded-lg font-bold hover:bg-rose-500 transition">UNLOCK VIP ACCESS</button>
        </div>
    </div>

    <div class="chat-box p-4 border border-gray-800">
        <div id="chatFeed" class="flex flex-col">
            </div>
    </div>

</div>

<script>
    // VIDEO LIST (Rotate korbe)
    const videos = [
        "https://drive.google.com/file/d/1ukOYy9zg6iNI1TdMOV98l5wbuTnEvU9D/preview",
        "https://drive.google.com/file/d/13SzbqnfE2kgRpaE2cdNV_EJG3I0UwP8G/preview",
        "https://drive.google.com/file/d/1t3hTzBZVNap-QgDYVPrho_0cch46Vj2k/preview",
        "https://drive.google.com/file/d/1DljnoDdClNr7db7M_okO1j8ccuDI-hBO/preview"
    ];

    // Video rotator
    let currentVid = 0;
    const player = document.getElementById('camPlayer');
    function changeVideo() {
        player.src = videos[currentVid];
        currentVid = (currentVid + 1) % videos.length;
    }
    changeVideo();
    setInterval(changeVideo, 30000); // 30 sec por por video change hobe

    // Realistic Chat Simulator
    const chatFeed = document.getElementById('chatFeed');
    const names = ["Mike_X", "User_99", "Alpha_Guy", "Guest_88", "Tony", "BigFan"];
    const msgs = ["She looks stunning today!", "Hey baby, are you active?", "How to enter private?", "Just unlocked the VIP, worth it!", "Is it live?"];

    function addChat() {
        const name = names[Math.floor(Math.random() * names.length)];
        const msg = msgs[Math.floor(Math.random() * msgs.length)];
        const div = document.createElement('div');
        div.className = "message text-sm";
        div.innerHTML = `<span class="font-bold text-rose-500">${name}:</span> <span class="text-gray-300">${msg}</span>`;
        chatFeed.appendChild(div);
        chatFeed.scrollTop = chatFeed.scrollHeight;
        
        // Random time between 1 to 3 seconds
        setTimeout(addChat, Math.random() * 2000 + 1000);
    }
    addChat();
</script>

</body>
</html>
